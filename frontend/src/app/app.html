<!-- INTRO SCREEN -->
<div class="intro-screen" *ngIf="showIntro()" [ngClass]="introAnimClass()">
  <div class="intro-content">
    <div class="logo-container">🇹🇷</div>
    <h1 class="welcome-text">TÜRKİYE</h1>
    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
  </div>
</div>

<!-- MAIN LAYOUT -->
<div class="main-layout" *ngIf="!showIntro()">
  
  <!-- LEFT: CHAT SECTION -->
  <div class="chat-section">
    <div class="chat-header">
      <h2>🇹🇷 Rehber</h2>
      <p>Yapay Zeka Destekli Seyahat Asistanınız</p>
    </div>
    
    <div class="chat-messages" #chatScrollContainer>
      <div class="message" *ngFor="let msg of messages()" [ngClass]="msg.role">
        <div class="avatar" *ngIf="msg.role === 'assistant'">🤖</div>
        <div class="bubble">
          {{ msg.content }}
        </div>
      </div>
      <div class="message assistant" *ngIf="isLoading()">
        <div class="avatar">🤖</div>
        <div class="bubble typing">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>
    
    <div class="chat-input-wrapper">
      <div class="chat-input-box">
        <input 
          type="text" 
          [ngModel]="userInput()" 
          (ngModelChange)="onInputChange($event)"
          (keyup.enter)="sendMessage()" 
          placeholder="Nereyi keşfetmek istersiniz?"
          [disabled]="isLoading()"
        />
        <button class="send-btn" (click)="sendMessage()" [disabled]="isLoading() || !userInput().trim()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3.478 2.404a.75.75 0 00-.926.941l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.404z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- RIGHT: VISUALS FLOW -->
  <div class="visuals-section">
    <div class="image-flow">
      <!-- Column 1 -->
      <div class="image-column">
        <div class="image-card" *ngFor="let img of images"><img [src]="img" alt="Türkiye" /></div>
        <div class="image-card" *ngFor="let img of images"><img [src]="img" alt="Türkiye" /></div>
      </div>
      <!-- Column 2 (Reverse) -->
      <div class="image-column reverse">
        <div class="image-card" *ngFor="let img of imagesReverse"><img [src]="img" alt="Türkiye" /></div>
        <div class="image-card" *ngFor="let img of imagesReverse"><img [src]="img" alt="Türkiye" /></div>
      </div>
      <!-- Column 3 -->
      <div class="image-column">
        <div class="image-card" *ngFor="let img of images"><img [src]="img" alt="Türkiye" /></div>
        <div class="image-card" *ngFor="let img of images"><img [src]="img" alt="Türkiye" /></div>
      </div>
    </div>
    
    <div class="visuals-overlay">
      <div class="overlay-content">
        <h1>Büyülü <span>Türkiye'yi</span> Keşfedin.</h1>
        <p>Binlerce yıllık tarih, eşsiz doğal güzellikler ve unutulmaz lezzetler. Yolculuğunuza hemen başlayın.</p>
      </div>
    </div>
  </div>
</div>
