<!-- SPLASH SCREEN -->
<div class="splash-screen" *ngIf="showIntro()" [ngClass]="introAnimClass()">

    <circle cx="0" cy="0" r="70" stroke="#0F2D8B" stroke-width="1" opacity="0.25"/>
    <polygon points="0,-120 10,-10 120,0 10,10 0,120 -10,10 -120,0 -10,-10" fill="#0F2D8B" opacity="0.18"/>
    <polygon points="0,-90 7,-7 90,0 7,7 0,90 -7,7 -90,0 -7,-7" fill="#0F2D8B" opacity="0.22"/>
    <circle cx="0" cy="0" r="14" fill="#0F2D8B" opacity="0.38"/>
    <circle cx="0" cy="0" r="6" fill="#E30A17" opacity="0.6"/>
  </svg>
  <svg class="splash-corner corner-tr" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg" fill="none">
    <circle cx="150" cy="0" r="130" stroke="#0F2D8B" stroke-width="1.5" opacity="0.45"/>
    <circle cx="150" cy="0" r="100" stroke="#0F2D8B" stroke-width="1" opacity="0.35"/>
    <circle cx="150" cy="0" r="70" stroke="#0F2D8B" stroke-width="1" opacity="0.25"/>
    <polygon points="150,-120 160,-10 270,0 160,10 150,120 140,10 30,0 140,-10" fill="#0F2D8B" opacity="0.18"/>
    <polygon points="150,-90 157,-7 240,0 157,7 150,90 143,7 60,0 143,-7" fill="#0F2D8B" opacity="0.22"/>
    <circle cx="150" cy="0" r="14" fill="#0F2D8B" opacity="0.38"/>
    <circle cx="150" cy="0" r="6" fill="#E30A17" opacity="0.6"/>

    <circle cx="388" cy="155" r="2.5" fill="#1E40AF" opacity="0.5"/>
    <circle cx="620" cy="148" r="2.5" fill="#1E40AF" opacity="0.5"/>
    <circle cx="500" cy="5" r="3" fill="#1E40AF" opacity="0.4"/>
  </svg>

</div>

<!-- MAIN LAYOUT -->
<div class="main-layout" *ngIf="!showIntro()">

  <!-- LEFT: CHAT SECTION -->
  <div class="chat-section">
    <div class="chat-header">
      <div class="chat-header-icon">
        <svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
          <circle cx="15" cy="15" r="15" fill="#E30A17"/>
          <polygon points="15,5 18,12 26,12 20,17 22,25 15,20 8,25 10,17 4,12 12,12" fill="white"/>
        </svg>
      </div>
      <div class="chat-header-text">
        <h2>Rehber</h2>
        <p>Yapay Zeka Destekli Seyahat Asistanınız</p>
      </div>
    </div>

    <div class="chat-messages" #chatScrollContainer>
      <div class="message" *ngFor="let msg of messages()" [ngClass]="msg.role">
        <div class="avatar" *ngIf="msg.role === 'assistant'">
          <svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="11" fill="#E30A17"/>
            <polygon points="11,3.5 13.5,9 20,9 15,13 17,19.5 11,15.5 5,19.5 7,13 2,9 8.5,9" fill="white"/>
          </svg>
        </div>
        <div class="bubble" *ngIf="msg.role === 'assistant'" [innerHTML]="formatMessage(msg.content)"></div>
        <div class="bubble" *ngIf="msg.role === 'user'">{{ msg.content }}</div>
      </div>
      <div class="message assistant" *ngIf="isLoading()">
        <div class="avatar">
          <svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="11" fill="#E30A17"/>
            <polygon points="11,3.5 13.5,9 20,9 15,13 17,19.5 11,15.5 5,19.5 7,13 2,9 8.5,9" fill="white"/>
          </svg>
        </div>
        <div class="bubble typing">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

    <div class="chat-input-wrapper">
      <div class="chat-input-box">
        <input
          type="text"
          [ngModel]="userInput()"
          (ngModelChange)="onInputChange($event)"
          (keyup.enter)="sendMessage()"
          placeholder="Nereyi keşfetmek istersiniz?"
          [disabled]="isLoading()"
        />
        <button class="send-btn" (click)="sendMessage()" [disabled]="isLoading() || !userInput().trim()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3.478 2.404a.75.75 0 00-.926.941l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.404z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- RIGHT: PHOTO PANEL -->
  <div class="photo-panel">

    <!-- Corner decorations -->
    <svg class="panel-corner corner-tl" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M0 110 Q0 0 110 0" stroke="#2B4DB8" stroke-width="2" opacity="0.35"/>
      <path d="M0 80 Q0 0 80 0" stroke="#2B4DB8" stroke-width="1.5" opacity="0.3"/>
      <path d="M0 50 Q0 0 50 0" stroke="#2B4DB8" stroke-width="1" opacity="0.25"/>
      <circle cx="0" cy="0" r="115" stroke="#2B4DB8" stroke-width="1" opacity="0.18"/>
      <polygon points="0,-90 8,-8 90,0 8,8 0,90 -8,8 -90,0 -8,-8" fill="#2B4DB8" opacity="0.1"/>
      <circle cx="0" cy="0" r="10" fill="#2B4DB8" opacity="0.22"/>
    </svg>
    <svg class="panel-corner corner-tr" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M130 110 Q130 0 20 0" stroke="#2B4DB8" stroke-width="2" opacity="0.35"/>
      <path d="M130 80 Q130 0 50 0" stroke="#2B4DB8" stroke-width="1.5" opacity="0.3"/>
      <path d="M130 50 Q130 0 80 0" stroke="#2B4DB8" stroke-width="1" opacity="0.25"/>
      <circle cx="130" cy="0" r="115" stroke="#2B4DB8" stroke-width="1" opacity="0.18"/>
      <circle cx="130" cy="0" r="10" fill="#2B4DB8" opacity="0.22"/>
    </svg>
    <svg class="panel-corner corner-bl" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M0 20 Q0 130 110 130" stroke="#2B4DB8" stroke-width="2" opacity="0.35"/>
      <path d="M0 50 Q0 130 80 130" stroke="#2B4DB8" stroke-width="1.5" opacity="0.3"/>
      <path d="M0 80 Q0 130 50 130" stroke="#2B4DB8" stroke-width="1" opacity="0.25"/>
      <circle cx="0" cy="130" r="115" stroke="#2B4DB8" stroke-width="1" opacity="0.18"/>
      <circle cx="0" cy="130" r="10" fill="#2B4DB8" opacity="0.22"/>
    </svg>
    <svg class="panel-corner corner-br" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg" fill="none">
      <path d="M130 20 Q130 130 20 130" stroke="#2B4DB8" stroke-width="2" opacity="0.35"/>
      <path d="M130 50 Q130 130 50 130" stroke="#2B4DB8" stroke-width="1.5" opacity="0.3"/>
      <path d="M130 80 Q130 130 80 130" stroke="#2B4DB8" stroke-width="1" opacity="0.25"/>
      <circle cx="130" cy="130" r="115" stroke="#2B4DB8" stroke-width="1" opacity="0.18"/>
      <circle cx="130" cy="130" r="10" fill="#2B4DB8" opacity="0.22"/>
    </svg>

    <!-- Welcome text (cream area, top-left) -->
    <div class="panel-welcome">
      <p class="welcome-line1">Türkiye'yi</p>
      <p class="welcome-line2">Keşfet!</p>
    </div>

    <!-- Slide content: photo (fades) -->
    <div class="slide-content" [class.slide-hidden]="!slideVisible()">
      <div class="photo-area">
        <img [src]="slides[currentSlide()].photo" [alt]="slides[currentSlide()].alt" class="photo-img"/>
      </div>
    </div>

  </div>
</div>
